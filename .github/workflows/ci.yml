name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always
  MATURIN_PEP517_ARGS: --strip

jobs:
  lint:
    name: Lint (Rust + Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust fmt
        run: cargo fmt --all -- --check

      - name: Rust clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python linting tools
        run: pip install ruff black

      - name: Check Python formatting (black)
        run: black --check pdf2word tests

      - name: Lint Python (ruff)
        run: ruff check pdf2word tests

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libopenblas-dev libgl1-mesa-glx libglib2.0-0 libsm6 libxext6 \
            libxrender-dev libgomp1 poppler-utils tesseract-ocr tesseract-ocr-eng

      - name: Install maturin
        run: pip install maturin

      - name: Build and install package
        run: maturin develop --release

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Run doctests
        run: python -m doctest pdf2word/*.py -v || true

  build-wheels:
    name: Build Wheels
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install maturin
        run: pip install maturin

      - name: Build wheels
        run: |
          maturin build --release --strip --out dist
          ls -la dist/

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: dist/*.whl

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build-wheels
    if: github.event_name == 'release'
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheels
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'release'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: pdf2word
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name == 'release' || github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  benchmark:
    name: Performance Benchmark
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libopenblas-dev libgl1-mesa-glx libglib2.0-0 libsm6 libxext6 \
            libxrender-dev libgomp1 poppler-utils

      - name: Install maturin
        run: pip install maturin

      - name: Build and install package
        run: maturin develop --release

      - name: Download test PDF
        run: |
          wget -q -O test.pdf "https://www.w3.org/WAI/WCAG21/Techniques/pdf/img/table-word.pdf" || \
          python -c "
          import fitz
          doc = fitz.open()
          page = doc.new_page(width=595, height=842)
          page.insert_text((50, 50), 'Benchmark Test Document', fontsize=24)
          for i in range(20):
              page.insert_text((50, 100 + i*30), f'Paragraph {i+1}: This is a test paragraph with some text content for benchmarking.', fontsize=12)
          page.insert_text((50, 500), 'Table:', fontsize=14)
          for r in range(5):
              for c in range(4):
                  page.insert_text((50 + c*100, 530 + r*20), f'Cell {r},{c}', fontsize=10)
          doc.save('test.pdf')
          doc.close()
          "

      - name: Run benchmark
        run: |
          python -m pdf2word convert test.pdf output.docx --dpi 300 --no-table 2>&1 | tee benchmark.log
          echo "Benchmark completed"
          tail -20 benchmark.log

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            benchmark.log
            output.docx