[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "pdf2word"
version = "0.1.0"
description = "Convert image-based PDF to editable Word documents with OCR and layout analysis"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "pdf2word Contributors"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.9"
dependencies = [
    "pymupdf>=1.23.0",
    "rapidocr-onnxruntime>=1.3.0",
    "python-docx>=1.1.0",
    "opencv-python-headless>=4.8.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "pystray>=0.19.0",
    "tqdm>=4.66.0",
    "click>=8.1.0",
    "lxml>=4.9.0",
    "beautifulsoup4>=4.12.0",
    "mcp>=1.10.0",
    "uvicorn>=0.27.0",
]

[project.optional-dependencies]
# Table recognition is optional. Packaged builds download these on first use;
# source installs can opt in eagerly with `pip install -e ".[table]"`.
table = [
    "torch>=2.1.0",
    "transformers>=4.35.0",
    "timm>=1.0.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-benchmark>=4.0.0",
    "py-spy>=0.3.14",
    "maturin>=1.7.0",
]

[tool.maturin]
features = ["pyo3/extension-module"]
compatibility = "linux"
bindings = "pyo3"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py39"