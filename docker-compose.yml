version: '3.8'

services:
  pdf2word:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: pdf2word:latest
    container_name: pdf2word
    volumes:
      - ./input:/app/input:ro
      - ./output:/app/output
    environment:
      - OMP_NUM_THREADS=4
      - MKL_NUM_THREADS=4
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
    # Run conversion on startup
    # command: convert /app/input/document.pdf /app/output/document.docx --dpi 300

  # Development service with source mounted
  pdf2word-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: python-builder
    image: pdf2word:dev
    container_name: pdf2word-dev
    volumes:
      - .:/app
      - ./input:/app/input:ro
      - ./output:/app/output
    environment:
      - OMP_NUM_THREADS=4
      - MKL_NUM_THREADS=4
    command: sleep infinity
    stdin_open: true
    tty: true